spring.application.name=nubom

# ------------------------------------------------------------------
# Credenciales locales. Copia application-local.properties.example como
# application-local.properties (en la raiz del proyecto) y llena tus
# valores. Ese archivo no se sube al repositorio.
# ------------------------------------------------------------------
spring.config.import=optional:file:./application-local.properties

server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/paginas/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ------------------------------------------------------------------
# Base de datos (MariaDB) y pool de conexiones.
# La contrasena no tiene valor por omision: se define en la variable de
# entorno NUBOM_DB_PASSWORD o en application-local.properties.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:mariadb://localhost:3306/nubom?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${NUBOM_DB_USER:root}
spring.datasource.password=${NUBOM_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate. En desarrollo el esquema se recrea en cada arranque y se
# cargan los datos de data.sql. Fuera de desarrollo: ddl-auto=validate y
# spring.sql.init.mode=never.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Paginacion de la API
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ------------------------------------------------------------------
# Sesion de la aplicacion web
# ------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ------------------------------------------------------------------
# JWT y refresh token de la API.
# La clave de firma no tiene valor por omision: se define NUBOM_JWT_SECRET
# (minimo 32 bytes aleatorios en Base64, por ejemplo: openssl rand -base64 32).
# ------------------------------------------------------------------
nubom.jwt.secret=${NUBOM_JWT_SECRET}
nubom.jwt.access-expiration=15m
nubom.jwt.refresh-expiration=7d
nubom.jwt.limpieza-cron=0 30 3 * * *

# CORS de la API (origenes separados por coma)
nubom.cors.allowed-origins=http://localhost:5173

# ------------------------------------------------------------------
# Avisos de caducidad
# ------------------------------------------------------------------
nubom.caducidad.dias-aviso=3
nubom.caducidad.cron=0 0 8 * * *
nubom.caducidad.ejecutar-al-iniciar=true

# ------------------------------------------------------------------
# Correo. Desactivado por omision: para enviar correos reales define
# NUBOM_MAIL_ENABLED=true junto con el usuario y la contrasena SMTP.
# ------------------------------------------------------------------
nubom.mail.enabled=${NUBOM_MAIL_ENABLED:false}
nubom.mail.from=${NUBOM_MAIL_USER:nubom@localhost}
spring.mail.host=${NUBOM_MAIL_HOST:smtp.gmail.com}
spring.mail.port=587
spring.mail.username=${NUBOM_MAIL_USER:}
spring.mail.password=${NUBOM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ------------------------------------------------------------------
# Open Food Facts (API externa de productos)
# ------------------------------------------------------------------
nubom.openfoodfacts.base-url=https://world.openfoodfacts.org
nubom.openfoodfacts.connect-timeout=3s
nubom.openfoodfacts.read-timeout=5s

# Bitacoras
logging.level.dgtic.core=INFO
logging.level.org.springframework.security=WARN
