<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head(titulo='Error')}"></head>
<body>

<!-- Página de error general de la aplicación web (Spring Boot la usa para cualquier
     estado de error). No muestra detalles internos: solo el código y un texto breve. -->
<div class="login-wrapper">
    <div class="login-card text-center">
        <div class="logo-circle"><i class="bi bi-emoji-frown"></i></div>
        <h2 class="brand-font mb-2" th:text="${status == 404} ? 'No encontramos esa página' : (${status == 403} ? 'Acceso denegado' : 'Algo salió mal')">Algo salió mal</h2>
        <p class="text-muted" th:if="${status == 404}">El enlace puede estar mal escrito o el contenido ya no existe.</p>
        <p class="text-muted" th:if="${status == 403}">Tu sesión expiró o no tienes permiso para esta acción. Vuelve a intentarlo desde el inicio.</p>
        <p class="text-muted" th:if="${status != 404 and status != 403}">Ocurrió un error inesperado. Inténtalo de nuevo en un momento.</p>
        <p class="small text-muted">Código <span th:text="${status}">500</span></p>
        <a th:href="@{/inicio}" class="btn btn-nubom w-100 mt-2">Volver al inicio</a>
    </div>
</div>

</body>
</html>
