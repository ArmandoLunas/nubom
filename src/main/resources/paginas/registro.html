<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantillas/plantilla :: head(titulo='Crear cuenta')}"></head>
<body>

<div class="login-wrapper">
    <div class="login-card" style="max-width: 460px;">
        <div class="text-center">
            <div class="logo-circle"><i class="bi bi-person-plus"></i></div>
            <h2 class="brand-font mb-0">Crea tu cuenta</h2>
            <p class="text-muted">Después podrás crear tu hogar en NUBOM</p>
        </div>

        <form method="post" th:action="@{/registro}" th:object="${registro}" class="mt-3">

            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger py-2">
                <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label fw-semibold">Nombre</label>
                <input type="text" class="form-control" id="nombre"
                       th:field="*{nombre}" th:errorclass="is-invalid" placeholder="Tu nombre">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label fw-semibold">Correo</label>
                <input type="text" class="form-control" id="correo"
                       th:field="*{correo}" th:errorclass="is-invalid" placeholder="tu@correo.com">
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="contrasena"
                       th:field="*{contrasena}" th:errorclass="is-invalid" placeholder="Mínimo 8 caracteres">
            </div>
            <div class="mb-3">
                <label for="confirmarContrasena" class="form-label fw-semibold">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmarContrasena"
                       th:field="*{confirmarContrasena}" th:errorclass="is-invalid" placeholder="Repite tu contraseña">
            </div>

            <button type="submit" class="btn btn-nubom w-100 mt-2">
                <i class="bi bi-check-circle me-1"></i> Crear cuenta
            </button>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
            ¿Ya tienes cuenta? <a th:href="@{/login}" class="fw-semibold" style="color: var(--nubom-terracota);">Inicia sesión</a>
        </p>
    </div>
</div>

</body>
</html>
